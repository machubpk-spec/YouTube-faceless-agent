name: Shorts Video Pipeline

on:
  schedule:
    - cron: '0 12 * * 2,4,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick fonts-dejavu-core
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/g' /etc/ImageMagick-6/policy.xml || true
          sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<policy domain="path" rights="read|write" pattern="@*"/g' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Create Fallback Background Music
        run: |
          if [ ! -f "bg_music_energetic.mp3" ]; then
            ffmpeg -f lavfi -i "sine=frequency=140:duration=120" -af "volume=0.08,lowpass=f=240" -c:a libmp3lame -q:a 4 bg_music_energetic.mp3 -y
          fi

      - name: Restore YouTube OAuth Token
        run: |
          cat << 'EOF' > token.json
          ${{ secrets.YOUTUBE_TOKEN_JSON }}
          EOF

      - name: Determine Mode (Extract vs Standalone)
        id: mode_check
        run: |
          DAY=$(date +%u)
          if [ "$DAY" = "2" ] && [ -f "scripts/mon_script.txt" ]; then
            echo "mode=extract" >> $GITHUB_OUTPUT
            echo "source=scripts/mon_script.txt" >> $GITHUB_OUTPUT
          elif [ "$DAY" = "4" ] && [ -f "scripts/wed_script.txt" ]; then
            echo "mode=extract" >> $GITHUB_OUTPUT
            echo "source=scripts/wed_script.txt" >> $GITHUB_OUTPUT
          else
            echo "mode=standalone" >> $GITHUB_OUTPUT
            echo "source=none" >> $GITHUB_OUTPUT
          fi

      - name: Run Shorts Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python main_shorts.py --mode ${{ steps.mode_check.outputs.mode }} --source ${{ steps.mode_check.outputs.source }}

      - name: Save Updated Queue to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue.json
          git commit -m "chore: update queue after short [skip ci]" || echo "No changes"
          git push

      - name: Notify Telegram on Success
        if: success()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
              -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
              -d text="🔥 New Short uploaded successfully!"
          fi

      - name: Notify Telegram on Failure
        if: failure()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
              -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
              -d text="⚠️ Shorts pipeline FAILED! Check GitHub Actions logs."
          fi
