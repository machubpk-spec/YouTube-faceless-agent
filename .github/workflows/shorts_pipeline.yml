name: Kids Shorts Automation

on:
  schedule:
    - cron: '0 14 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-upload-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Restore YouTube OAuth Token
        run: |
          cat << 'EOF' > token.json
          ${{ secrets.YOUTUBE_TOKEN_JSON }}
          EOF

      - name: Run Shorts Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python main_shorts.py

      - name: Save Updated Queue to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add queue.json
          git commit -m "chore: update queue status [skip ci]" || echo "No changes"
          git push

      - name: Notify Telegram on Success
        if: success()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
              -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
              -d text="✅ Kids Short uploaded successfully!"
          fi

      - name: Notify Telegram on Failure
        if: failure()
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
              -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
              -d text="❌ Kids Short pipeline failed. Check Actions logs."
          fi
